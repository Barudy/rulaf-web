     <p id="result-msg" class="text-gray-600 mb-6"></p><button data-template-id="retry-button" class="canva-button px-6 py-3 rounded-lg font-semibold" onclick="restartQuiz()"></button>

  <script src="/_sdk/a051f9537983733d.editing_sdk.js" integrity="sha512-IWn3eBHnVt7zQ0Rp79J72qSgJoLbskCA9lcfY4retf+5km4LjuhSHpvx+182KCHmEZ6EbJtWqVsybpV8Sd8PQQ=="></script>
  <script>
        const questions = [
            { q: "Apakah pengertian Solat Hari Raya?", opts: ["Solat sunat yang didirikan pada pagi Hari Raya", "Solat wajib lima waktu", "Solat yang dilakukan sebelum tidur", "Solat khusus pada waktu malam"], ans: 0, type: "mcq" },
            { q: "Betul atau salah: Hukum Solat Hari Raya ialah Sunat Muakkad.", opts: ["Betul", "Salah"], ans: 0, type: "tf" },
            { q: "Apakah dalil yang menjadi asas pensyariatan Solat Hari Raya?", opts: ["Surah Al-Kauthar ayat 2", "Surah Al-Fatihah ayat 1", "Surah Al-Ikhlas ayat 1", "Surah An-Nas ayat 1"], ans: 0, type: "mcq" },
            { q: "Betul atau salah: Solat Hari Raya membantu meraikan kemenangan dan meningkatkan kesyukuran kepada Allah.", opts: ["Betul", "Salah"], ans: 0, type: "tf" },
            { q: "Bagaimanakah cara menghayati hikmah Hari Raya?", opts: ["Bermaaf-maafan dan mengeratkan silaturahim", "Bergaduh dengan jiran", "Meninggalkan solat", "Membazir tanpa kawalan"], ans: 0, type: "mcq" }
        ];

        let current = 0, score = 0, answered = false;

        function render() {
            document.getElementById('progress').textContent = `Soalan ${current + 1} / ${questions.length}`;
            document.getElementById('score-display').textContent = `Skor: ${score}`;
            document.getElementById('question-text').textContent = questions[current].q;
            document.getElementById('feedback').classList.add('hidden');
            const opts = document.getElementById('options');
            opts.innerHTML = '';
            const isTrue = questions[current].type === 'tf';
            questions[current].opts.forEach((o, i) => {
                const btn = document.createElement('button');
                btn.textContent = o;
                const baseClass = 'w-full p-4 rounded-lg border-2 border-teal-200 bg-white text-gray-800 font-medium hover:bg-teal-50 hover:border-teal-400 transition-all';
                const alignClass = isTrue ? 'text-center' : 'text-left';
                btn.className = `${baseClass} ${alignClass}`;
                btn.onclick = () => selectAnswer(i, btn);
                opts.appendChild(btn);
            });
            answered = false;
        }

        function selectAnswer(i, btn) {
            if (answered) return;
            answered = true;
            const correct = questions[current].ans === i;
            if (correct) score++;
            const btns = document.getElementById('options').children;
            for (let b of btns) {
                b.disabled = true;
                b.classList.add('cursor-not-allowed');
            }
            btn.className = btn.className.replace('border-teal-200', correct ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50');
            if (!correct) btns[questions[current].ans].className = btns[questions[current].ans].className.replace('border-teal-200', 'border-green-500 bg-green-50');
            const fb = document.getElementById('feedback');
            fb.textContent = correct ? '✓ Betul!' : '✗ Salah';
            fb.className = `mt-4 text-center font-semibold text-lg ${correct ? 'text-green-600' : 'text-red-600'}`;
            fb.classList.remove('hidden');
            setTimeout(() => {
                current++;
                if (current < questions.length) render();
                else showResult();
            }, 1200);
        }

        function showResult() {
            document.getElementById('quiz-area').classList.add('hidden');
            const r = document.getElementById('result-area');
            r.classList.remove('hidden');
            document.getElementById('result-title').textContent = 'Tahniah!';
            document.getElementById('result-score').textContent = `${score} / ${questions.length}`;
            document.getElementById('result-msg').textContent = score >= 5 ? 'Cemerlang! Anda memahami Solat Hari Raya dengan baik.' : score >= 4 ? 'Bagus! Teruskan belajar.' : 'Cuba lagi dan tingkatkan pengetahuan anda.';
        }

        function restartQuiz() {
            current = 0; score = 0;
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            render();
        }

        render();
    </script>
